name: Continuous APK Build
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 💎 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Setup Google Services
        # Create it in the root first
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > ./google-services.json

      - name: 📦 Install Dependencies
        run: npm ci --engine-strict false

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          cache: true

      - name: 🛠 Prebuild and Build APK
        env:
          EXPO_PUBLIC_APP_TITLE: ${{ secrets.APP_TITLE }}
          EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          EXPO_PUBLIC_TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          EXPO_PUBLIC_TMDB_IMAGE_BASE: ${{ secrets.TMDB_IMAGE_BASE }}
        run: |
          # 1. Generate the 'android' folder
          npx expo prebuild --platform android --no-install
          
          # 2. MANUALLY COPY the file into the native app folder 
          # This satisfies the RUN_GRADLEW search locations
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          
          # 3. Build locally
          npx eas-cli build --platform android --profile preview --local --non-interactive --output=./youplex-latest.apk

      - name: 🚢 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
            # Creates tags like 'v45', 'v46'
            tag_name: v${{ github.run_number }}
            name: Build v${{ github.run_number }}
            body: |
              **Youplex Automated Build**
              - **Build Number:** ${{ github.run_number }}
              - **Commit:** ${{ github.sha }}
            # This ensures this new tag is marked as the "Latest Release"
            make_latest: true
            files: ./youplex-latest.apk
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          debug: true
          format: markdown
          disable_web_page_preview: true
          message: |
            🚀 *New Youplex APK Build Success!*
            
            📝 *Message:* `${{ github.event.head_commit.message }}`
            
            🔗 [Direct Download](https://github.com/${{ github.repository }}/releases/latest/download/youplex-latest.apk)

      - name: 💬 Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "@everyone 📢 New Build Status Update for Youplex Apk"
          title: "YouPlex Build: ${{ job.status }}"
          description: |
            **Message:** ${{ github.event.head_commit.message }}
            **Download:** [Click here](https://github.com/${{ github.repository }}/releases/latest/download/youplex-latest.apk)
            **Logs:** [View Build Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ job.status == 'success' && '0x2ecc71' || '0xe74c3c' }}