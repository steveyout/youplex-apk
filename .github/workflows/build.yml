name: Continuous APK Build
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --engine-strict false

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🛠 Build APK (Local EAS)
        id: build_step
        env:
          EXPO_PUBLIC_APP_TITLE: ${{ secrets.APP_TITLE }}
          EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          EXPO_PUBLIC_TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          EXPO_PUBLIC_TMDB_IMAGE_BASE: ${{ secrets.TMDB_IMAGE_BASE }}
        run: npx eas-cli build --platform android --profile preview --local --non-interactive --output=./youplex-latest.apk

      - name: 🧹 Clean Old Assets
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest "youplex-latest.apk" -y || true

      - name: 🚢 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            **Build Details**
            - **Commit:** ${{ github.sha }}
            - **Message:** ${{ github.event.head_commit.message }}
          files: ./youplex-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            🚀 *New Youplex APK Build Success!*
            
            📝 *Message:* `${{ github.event.head_commit.message }}`
            
            🔗 [Direct Download](https://github.com/${{ github.repository }}/releases/latest/download/youplex-latest.apk)

      - name: 💬 Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always() # This ensures you get an alert even if the build fails
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          # The 'content' field is where @everyone pings actually work
          content: "@everyone 📢 New Build Status Update for Youplex Apk"
          title: "YouPlex Build: ${{ job.status }}"
          description: |
            **Message:** ${{ github.event.head_commit.message }}
            **Download:** [Click here](https://github.com/${{ github.repository }}/releases/latest/download/youplex-latest.apk)
            **Logs:** [View Build Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ job.status == 'success' && '0x2ecc71' || '0xe74c3c' }}