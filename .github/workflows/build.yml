name: 🎬 Youplex Continuous APK Build

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 💎 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret is missing! Using empty config."
            echo "{}" > google-services.json
          fi

      - name: 🔢 Auto-Version app.json
        run: |
          jq '.expo.version = "1.0.${{ github.run_number }}" | .expo.android.versionCode = ${{ github.run_number }}' app.json > app.json.tmp && mv app.json.tmp app.json

      - name: 🔄 Sync and Build @p-stream/providers
        run: |
          if [ -d "submodules/providers" ]; then
            cd submodules/providers
            npm install --ignore-scripts
            npm run build
            if [ -d "lib" ]; then
              echo "Successfully built latest @p-stream/providers from GitHub"
              mkdir -p $GITHUB_WORKSPACE/packages/@p-stream/providers
              cp -r lib $GITHUB_WORKSPACE/packages/@p-stream/providers/
            fi
            cd $GITHUB_WORKSPACE
          fi

      - name: 📦 Install Dependencies
        run: |
          npm ci --engine-strict false || npm install --engine-strict false --ignore-scripts
          node scripts/patch-expo-constants.js
          find . -name "hermesc*" -type f -exec chmod +x {} + 2>/dev/null || true

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          cache: true

      - name: 🛠 Prebuild and Build APKs (Phone & Android TV)
        env:
          EXPO_PUBLIC_APP_TITLE: ${{ secrets.APP_TITLE }}
          EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          EXPO_PUBLIC_TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          EXPO_PUBLIC_TMDB_IMAGE_BASE: ${{ secrets.TMDB_IMAGE_BASE }}
          EXPO_PUBLIC_PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. Update version in native Gradle
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle
          
          # 2. Configure for Dev build (isolated package so it installs side-by-side with production)
          if [ "${{ github.ref_name }}" == "dev" ]; then
            echo "Configuring Dev build: package=cc.youplex.movies.dev"
            sed -i 's/applicationId "[^"]*"/applicationId "cc.youplex.movies.dev"/g' android/app/build.gradle
            jq '.expo.android.package = "cc.youplex.movies.dev" | .expo.name = "Youplex (Dev)"' app.json > app.json.tmp && mv app.json.tmp app.json
          fi
          
          # 3. Finalize Android Setup
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          node scripts/patch-expo-constants.js
          find . -name "hermesc*" -type f -exec chmod +x {} + 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true
          
          # 4. Build Phone / Universal APK
          echo "Building Phone APK..."
          npx eas-cli build --platform android --profile preview --local --non-interactive --output=./youplex-phone.apk
          cp ./youplex-phone.apk ./youplex-latest.apk
          
          # 5. Build Dedicated Android TV APK (optimized with fixed landscape TV mode & Leanback flags)
          echo "Building Dedicated Android TV APK..."
          EXPO_PUBLIC_TARGET_TV=true npx eas-cli build --platform android --profile preview-tv --local --non-interactive --output=./youplex-tv.apk
          
          # 6. Versioned naming for releases
          if [ "${{ github.ref_name }}" == "dev" ]; then
            cp ./youplex-phone.apk ./youplex-dev-phone-v${{ github.run_number }}.apk
            cp ./youplex-tv.apk ./youplex-dev-tv-v${{ github.run_number }}.apk
          else
            cp ./youplex-phone.apk ./youplex-phone-v${{ github.run_number }}.apk
            cp ./youplex-tv.apk ./youplex-tv-v${{ github.run_number }}.apk
          fi

      - name: 🚢 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}
          name: ${{ github.ref_name == 'dev' && format('🧪 Youplex v{0}-dev (Development)', github.run_number) || format('🚀 Youplex v{0} (Production)', github.run_number) }}
          body: |
            ## 🎬 Youplex ${{ github.ref_name == 'dev' && 'Dev Build' || 'Production Release' }} (v1.0.${{ github.run_number }})
            
            - **Environment:** `${{ github.ref_name == 'dev' && 'Development (cc.youplex.movies.dev)' || 'Production (cc.youplex.movies)' }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Author:** @${{ github.actor }}
            
            ### 📝 Commit Message
            > ${{ github.event.head_commit.message || 'Manual build dispatch' }}
            
            ### 📥 Download Options
            - 📱 **Phone / Mobile APK:** [Download youplex-phone.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-phone.apk)
            - 📺 **Dedicated Android TV APK:** [Download youplex-tv.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-tv.apk)
            - 📦 **Standard Package:** [Download youplex-latest.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-latest.apk)
          prerelease: ${{ github.ref_name == 'dev' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: |
            ./youplex-latest.apk
            ./youplex-phone.apk
            ./youplex-tv.apk
            ${{ github.ref_name == 'dev' && './youplex-dev-phone-v*.apk' || './youplex-phone-v*.apk' }}
            ${{ github.ref_name == 'dev' && './youplex-dev-tv-v*.apk' || './youplex-tv-v*.apk' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ Delete Old Releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              try {
                const { data: releases } = await github.rest.repos.listReleases({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              
                if (!releases || releases.length <= 4) {
                  console.log("Found 4 or fewer releases. Skipping cleanup.");
                  return;
                }
              
                const toDelete = releases.slice(4);
              
                for (const release of toDelete) {
                  console.log(`Deleting release ${release.tag_name}...`);
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
              
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `tags/${release.tag_name}` || release.tag_name,
                    });
                  } catch (e) {
                    console.log(`Tag for ${release.tag_name} already deleted.`);
                  }
                }
              } catch (err) {
                console.log("No releases found or error listing releases. Skipping.");
              }

      # -------------------------------------------------------------
      # NOTIFICATIONS (Telegram & Discord for BOTH main & dev builds)
      # -------------------------------------------------------------

      - name: 📢 Telegram Notification (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            ${{ github.ref_name == 'dev' && '🧪 <b>Youplex Dev Build Ready!</b>' || '🚀 <b>Youplex Production Release is Out!</b>' }}
            ━━━━━━━━━━━━━━━━━━━━
            📦 <b>Version:</b> <code>1.0.${{ github.run_number }}</code> (Build #${{ github.run_number }})
            🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code> (${{ github.ref_name == 'dev' && 'Development' || 'Production' }})
            📱 <b>Package:</b> <code>${{ github.ref_name == 'dev' && 'cc.youplex.movies.dev' || 'cc.youplex.movies' }}</code>
            👤 <b>Author:</b> @${{ github.actor }}
            📝 <b>Commit:</b> <i>${{ github.event.head_commit.message || 'Manual build dispatch' }}</i>
            ━━━━━━━━━━━━━━━━━━━━
            📱 <a href="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-phone.apk">Download Phone APK</a>
            📺 <a href="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-tv.apk">Download Android TV APK</a>
            🌐 <a href="https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}">View Release on GitHub</a>

      - name: 💬 Discord Notification (Success)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "${{ github.ref_name == 'dev' && format('🧪 Youplex Dev Build v{0}-dev Ready', github.run_number) || format('🚀 Youplex v{0} Released', github.run_number) }}"
          content: "${{ github.ref_name == 'dev' && format('🧪 New Youplex Dev build v{0}-dev is ready for testing!', github.run_number) || format('@everyone 📢 Youplex Update v{0} is ready!', github.run_number) }}"
          description: |
            **A new build of Youplex is ready for installation!**
            
            📦 **Version:** `1.0.${{ github.run_number }}` (Build #${{ github.run_number }})
            🌿 **Branch:** `${{ github.ref_name }}` (${{ github.ref_name == 'dev' && 'Development' || 'Production' }})
            📱 **Package ID:** `${{ github.ref_name == 'dev' && 'cc.youplex.movies.dev' || 'cc.youplex.movies' }}`
            👤 **Author:** @${{ github.actor }}
            📝 **Commit:** `${{ github.event.head_commit.message || 'Manual build dispatch' }}`
            
            📥 [Phone APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-phone.apk) • [Android TV APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}/youplex-tv.apk) • [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }})
          color: ${{ github.ref_name == 'dev' && '0x3B82F6' || '0xE50914' }}
