name: Build APK and Release
on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/checkout@v4
        with:
          node-version: 18

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🛠 Build APK (EAS)
        run: npx eas-build --platform android --profile preview --local --non-interactive --output=./youplex.apk

      - name: 🚢 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./youplex.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}